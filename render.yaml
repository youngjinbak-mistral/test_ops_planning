# Deploy to Render (https://render.com): New -> Blueprint, point at this repo.
# Free tier is enough (no disk: the app pulls the Google Sheet on every start;
# anything logged in the UI lives until the next restart/redeploy).
# Set ANNOTATION_SHEET_ID in the environment so sync-on-start works.
services:
  - type: web
    name: annotation-planner
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python3 -m planner.cli web
    envVars:
      - key: PLANNER_HOST
        value: 0.0.0.0
      - key: PLANNER_PORT
        value: "8000"
      - key: PLANNER_DATA_DIR
        value: /app/data
      - key: PLANNER_SYNC_ON_START
        value: "1"
      # - key: ANNOTATION_SHEET_ID
      #   value: <your-google-sheet-id>
